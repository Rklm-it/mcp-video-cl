services:
  video-mcp:
    build:
      context: .
      args:
        WITH_WHISPER: ${WITH_WHISPER:-1}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
    # Reachable only from this machine: for a reverse proxy already installed on the host
    # (install.sh wires system Caddy to it automatically).
    ports:
      - "127.0.0.1:${VIDEO_MCP_HOST_PORT:-8765}:8000"

  # Bundled HTTPS proxy, used when ports 80/443 are free:
  #   docker compose --profile builtin-proxy up -d
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["builtin-proxy"]
    depends_on:
      - video-mcp
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional: PO-token provider that helps when YouTube flags the VPS as a bot.
  # Start with: docker compose --profile pot up -d  and set YTDLP_POT_PROVIDER_URL in .env
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    profiles: ["pot"]
    expose:
      - "4416"

volumes:
  caddy_data:
  caddy_config:
